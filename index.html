<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Jam</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Jam">
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#000;--fg:#f2f2f2;--mut:#6b6b70;--acc:#ffffff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%}
body{font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;align-items:center;text-align:center;overflow:hidden;-webkit-user-select:none;user-select:none}
#time{font-size:32vmin;font-weight:200;line-height:1;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
#ampm{font-size:6vmin;font-weight:300;color:var(--mut);margin-left:1.5vmin;letter-spacing:0}
#date{font-size:4.6vmin;font-weight:300;color:var(--mut);margin-top:2.5vmin}
#solat{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:3.5vmin 0;width:92vmin;max-width:92vw;margin-top:8vmin}
.n{font-size:3.2vmin;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.t{font-size:5.4vmin;font-weight:300;margin-top:.8vmin;color:#9a9aa0;font-variant-numeric:tabular-nums}
.t small{font-size:.55em;margin-left:.4vmin}
.next .n,.next .t{color:var(--acc)}
.next .t{font-weight:500}
#zon{font-size:2.8vmin;color:#3a3a3e;margin-top:6vmin;letter-spacing:.1em}
</style>
</head>
<body>
<div><span id="time">--:--</span><span id="ampm"></span></div>
<div id="date"></div>
<div id="solat"></div>
<div id="zon">PETALING · SGR01</div>
<script>
(function () {
  var LAT = 3.1073, LNG = 101.6067, TZ = 8, R = Math.PI / 180;
  var HARI = ["Ahad","Isnin","Selasa","Rabu","Khamis","Jumaat","Sabtu"];
  var BULAN = ["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"];
  var NAMA = ["Subuh","Syuruk","Zohor","Asar","Maghrib","Isyak"];
  function sn(x){return Math.sin(x*R);} function cs(x){return Math.cos(x*R);}

  // Kira waktu solat (kaedah JAKIM: Subuh 20 darjah, Isyak 18 darjah, Asar mazhab Syafie)
  function kira(y, m, d) {
    var n = Date.UTC(y, m, d, 12 - TZ) / 86400000 + 2440587.5 - 2451545;
    var g = (357.529 + 0.98560028 * n) % 360, q = (280.459 + 0.98564736 * n) % 360;
    var L = q + 1.915 * sn(g) + 0.02 * sn(2 * g), e = 23.439 - 0.00000036 * n;
    var ra = Math.atan2(cs(e) * sn(L), cs(L)) / R; if (ra < 0) ra += 360; ra /= 15;
    var dec = Math.asin(sn(e) * sn(L)) / R;
    var eq = q / 15 - ra; if (eq > 12) eq -= 24; if (eq < -12) eq += 24;
    var noon = 12 + TZ - LNG / 15 - eq;
    function ha(alt) {
      var c = (sn(alt) - sn(LAT) * sn(dec)) / (cs(LAT) * cs(dec));
      return Math.acos(Math.max(-1, Math.min(1, c))) / R / 15;
    }
    var asr = Math.atan(1 / (1 + Math.tan(Math.abs(LAT - dec) * R))) / R;
    return [noon - ha(-20), noon - ha(-0.833), noon + 2 / 60, noon + ha(asr), noon + ha(-0.833), noon + ha(-18)];
  }
  function pad(n){return (n < 10 ? "0" : "") + n;}
  function fmt(h) {
    var t = Math.round(h * 60), hh = Math.floor(t / 60) % 24;
    return { min: t, t: ((hh % 12) || 12) + ":" + pad(t % 60), s: hh < 12 ? "AM" : "PM" };
  }

  var elT = document.getElementById("time"), elA = document.getElementById("ampm"),
      elD = document.getElementById("date"), elS = document.getElementById("solat");
  var hariKey = "", lastMin = -1, times = [];

  function tick() {
    var now = new Date(Date.now() + TZ * 3600000);
    var y = now.getUTCFullYear(), mo = now.getUTCMonth(), d = now.getUTCDate();
    var H = now.getUTCHours(), M = now.getUTCMinutes(), cur = H * 60 + M;
    if (cur === lastMin && hariKey === y + "-" + mo + "-" + d) return;
    lastMin = cur;
    elT.textContent = ((H % 12) || 12) + ":" + pad(M);
    elA.textContent = H < 12 ? "AM" : "PM";
    var key = y + "-" + mo + "-" + d;
    if (key !== hariKey) {
      hariKey = key;
      elD.textContent = HARI[now.getUTCDay()] + ", " + d + " " + BULAN[mo] + " " + y;
      var k = kira(y, mo, d);
      times = [];
      for (var i = 0; i < 6; i++) times.push(fmt(k[i]));
    }
    var next = 0;
    for (var j = 0; j < 6; j++) { if (times[j].min > cur) { next = j; break; } if (j === 5) next = 0; }
    var html = "";
    for (var p = 0; p < 6; p++) {
      html += '<div class="' + (p === next ? "next" : "") + '"><div class="n">' + NAMA[p] +
        '</div><div class="t">' + times[p].t + "<small>" + times[p].s + "</small></div></div>";
    }
    elS.innerHTML = html;
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
